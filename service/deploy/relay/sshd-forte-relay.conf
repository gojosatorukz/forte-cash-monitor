# Team server, REQUIRED sshd drop-in (Ubuntu's sshd_config includes /etc/ssh/sshd_config.d/*.conf).
# Applies only to the dedicated relay user. Why required: when the PC's link drops uncleanly, sshd without
# ClientAlive* keeps the dead session - and its 127.0.0.1:18000 listener - for up to ~2 hours (TCP keepalive).
# Every autossh reconnect then fails on ExitOnForwardFailure=yes and the public URL answers 502 all that time.
# With this file sshd drops the dead session within ~45 s and the reconnect binds the port again.
# Install: sudo cp sshd-forte-relay.conf /etc/ssh/sshd_config.d/forte-relay.conf
#          sudo sshd -t && sudo systemctl reload ssh
# Verify:  sudo sshd -T -C user=forte-relay,host=x,addr=1.2.3.4 | grep -i clientalive
#          -> clientaliveinterval 15 / clientalivecountmax 3
Match User forte-relay
    AllowTcpForwarding remote
    GatewayPorts no
    X11Forwarding no
    PermitTTY no
    ClientAliveInterval 15
    ClientAliveCountMax 3
